<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Painel da equipe da clínica.">
    <meta name="theme-color" content="#176b5b">
    <title>Painel da Clínica · Entrar</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../assets/logo/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Clínica">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<main class="admin-login">
    <div class="admin-login__card">
        <img src="../assets/logo/logo.svg" alt="" width="56" height="56">
        <h1>Painel da Clínica</h1>
        <p class="lead">Acesso exclusivo para a equipe.</p>
        <form id="admin-login-form" novalidate>
            <div class="field"><label for="email">E-mail</label>
                <input id="email" name="email" type="email" class="input" autocomplete="username" required></div>
            <div class="field"><label for="password">Senha</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" class="input" autocomplete="current-password" required>
                    <button type="button" class="icon-btn" data-toggle-password="password" aria-label="Mostrar senha"></button>
                </div></div>
            <p id="form-error" class="form-error" role="alert" hidden></p>
            <button id="admin-login-submit" type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <p class="hint mt-16"><a href="../recuperar-senha.html">Esqueci minha senha</a></p>
    </div>
</main>
<script type="module" src="../js/admin/login.js"></script>
</body>
</html>
