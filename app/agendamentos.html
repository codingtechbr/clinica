<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Agende consultas e exames e acompanhe seus resultados pelo celular.">
    <meta name="theme-color" content="#176b5b">
    <title>Agenda · Clínica Santa Casa</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../assets/logo/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Clínica">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <h1 class="app-header__title" id="page-title">Meus agendamentos</h1>
        <a class="icon-btn" href="agendar.html" aria-label="Novo agendamento"><span data-icon="plus"></span></a><a class="icon-btn" href="notificacoes.html" aria-label="Avisos" data-unread-target><span data-icon="bell"></span></a>
    </header>
    <main class="page-content">
        <div class="tabs" role="tablist" aria-label="Filtrar agendamentos">
            <button type="button" class="tab" role="tab" data-tab="active" aria-selected="true">Próximos</button>
            <button type="button" class="tab" role="tab" data-tab="past" aria-selected="false">Anteriores</button>
        </div>
        <div id="list" aria-live="polite"></div>
    </main>
</div>
<script type="module" src="../js/patient/appointments.js"></script>

</html>
