<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Agende consultas e exames e acompanhe seus resultados pelo celular.">
    <meta name="theme-color" content="#176b5b">
    <title>Assistente · Clínica Santa Casa</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../assets/logo/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Clínica">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="app-shell chat-page">
    <header class="app-header">
        <a class="icon-btn" href="home.html" aria-label="Voltar"><span data-icon="chevronLeft"></span></a>
        <h1 class="app-header__title">Assistente da clínica</h1>
        <button type="button" class="btn btn-ghost btn-sm" id="new-chat">Nova conversa</button>
    </header>
    <p class="chat-disclaimer">A assistente informa horários, preparo e se o resultado está pronto. Ela não interpreta exames nem faz diagnósticos. Emergência: 192.</p>
    <main id="messages" class="chat-messages" aria-live="polite"></main>
    <form id="chat-form" class="chat-input" autocomplete="off">
        <label for="chat-input" class="sr-only">Digite sua dúvida</label>
        <input id="chat-input" class="input" placeholder="Digite sua dúvida..." maxlength="800" enterkeyhint="send">
        <button id="chat-send" type="submit" class="chat-send" aria-label="Enviar"></button>
    </form>
</div>
<script type="module" src="../js/patient/assistant.js"></script>
</body>
</html>
